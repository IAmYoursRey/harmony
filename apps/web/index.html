<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" as="image" href="/logo.png" type="image/png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Harmony" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html { background-color: #f8fafc; }
      html.dark { background-color: #020617; color: #f8fafc; }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("theme");
          var isDark = theme === "dark" || (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
          var custom = localStorage.getItem("theme-custom");
          var preset = localStorage.getItem("theme-preset");
          if (custom) {
            var parsed = JSON.parse(custom);
            if (parsed && typeof parsed === "object") {
              Object.keys(parsed).forEach(function (shade) {
                root.style.setProperty("--brand-" + shade, parsed[shade]);
              });
            }
          } else if (preset && preset !== "blue" && /^[a-z0-9-]+$/i.test(preset)) {
            root.classList.add("theme-" + preset);
          }
          if (localStorage.getItem("harmony_perf_mode") === "lite") {
            root.classList.add("harmony-perf-lite");
          }
        } catch (e) {}
      })();
    </script>
    <title>Harmony — Platform Geospasial &amp; SPAB</title>
    <meta name="description" content="Platform edukasi kebencanaan, pemetaan geospasial, dan simulasi evakuasi sekolah terpadu." />
    <meta name="keywords" content="edukasi bencana, geospasial, digital twin, simulasi evakuasi, SPAB, Indonesia" />
    <meta name="author" content="Harmony" />

    <meta property="og:title" content="Harmony — Platform Geospasial &amp; SPAB" />
    <meta property="og:description" content="Sistem edukasi kebencanaan, pemetaan geospasial, dan simulasi evakuasi sekolah." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="id_ID" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
